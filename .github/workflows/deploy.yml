name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Sync to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎨 Build Frontend Assets
        run: |
          npm install --no-audit
          npm run build

      - name: 📂 Sync files to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || 'htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env*
            **/storage/logs/**
            **/scratch/**

      - name: 🔄 Auto-Clear Laravel Cache
        if: env.SITE_DOMAIN != ''
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          curl -s "https://${{ secrets.SITE_DOMAIN }}/system/maintenance?key=ff6dc8453b315ba7" || true
